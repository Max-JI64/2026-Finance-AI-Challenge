      <path d="M20 49 H30 M25 49 V32 M36 49 H46 M41 49 V24" fill="none" stroke="#101512" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="82" y="52" fill="#eef4f0" font-family="Pretendard, 'Noto Sans KR', system-ui, sans-serif" font-size="25" font-weight="850" letter-spacing="-1">버팀AI</text>
    <text x="680" y="50" fill="#aab8b0" font-family="Pretendard, 'Noto Sans KR', system-ui, sans-serif" font-size="15" font-weight="650">헤더 적용 크기</text>
