<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">버팀AI AI 및 데이터 처리 구조</title>
  <desc id="desc">사용자 입력과 내부 근거, 버팀AI 내부 모델·검색·공식 규칙·금융 계산, 선택형 외부 AI와 검증, 진단·비교·준비 출력 및 저장·전송 경계를 보여주는 도식</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L12 6 L0 12 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L12 6 L0 12 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 42px 'Malgun Gothic','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 400 21px 'Malgun Gothic','Noto Sans KR',sans-serif; fill: #475569; }
      .head { font: 700 27px 'Malgun Gothic','Noto Sans KR',sans-serif; fill: #ffffff; }
      .box-title { font: 700 23px 'Malgun Gothic','Noto Sans KR',sans-serif; fill: #0f172a; }
      .copy { font: 400 19px 'Malgun Gothic','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 400 17px 'Malgun Gothic','Noto Sans KR',sans-serif; fill: #475569; }
      .boundary { font: 700 20px 'Malgun Gothic','Noto Sans KR',sans-serif; fill: #7f1d1d; }
      .green-line { fill: none; stroke: #0f766e; stroke-width: 4; marker-end: url(#arrowGreen); }
      .blue-line { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#arrowBlue); }
      .blue-dash { fill: none; stroke: #2563eb; stroke-width: 4; stroke-dasharray: 10 9; marker-end: url(#arrowBlue); }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="#f8fafc"/>
  <text x="50" y="58" class="title">버팀AI AI 및 데이터 처리 구조</text>
  <text x="50" y="96" class="subtitle">사용자 입력, 내부 계산, 선택형 외부 AI와 결과 결정 권한을 분리했습니다.</text>

  <g filter="url(#shadow)">
    <rect x="35" y="130" width="400" height="745" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="35" y="130" width="400" height="66" rx="24" fill="#475569"/>
    <rect x="35" y="170" width="400" height="26" fill="#475569"/>
    <text x="70" y="174" class="head">1. 입력과 보관</text>
  </g>

  <rect x="70" y="230" width="330" height="165" rx="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="235" y="270" text-anchor="middle" class="box-title">사용자 입력</text>
  <text x="235" y="307" text-anchor="middle" class="copy">상권·업종, 매출·현금·비용·대출</text>
  <text x="235" y="339" text-anchor="middle" class="copy">선택 정책과 자격 답변</text>
  <text x="235" y="370" text-anchor="middle" class="small">현재 탭의 sessionStorage에 유지</text>

  <rect x="70" y="435" width="330" height="165" rx="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="235" y="475" text-anchor="middle" class="box-title">내부 근거</text>
  <text x="235" y="512" text-anchor="middle" class="copy">서울 상권·업종 집계 데이터</text>
  <text x="235" y="544" text-anchor="middle" class="copy">서비스에 등록된 공식 공고</text>
  <text x="235" y="575" text-anchor="middle" class="small">자격 규칙·정책 일정·공고 인덱스</text>

  <rect x="70" y="640" width="330" height="190" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="235" y="680" text-anchor="middle" class="box-title">외부 AI 전송 대상</text>
  <text x="235" y="717" text-anchor="middle" class="copy">동의한 What-if 문장</text>
  <text x="235" y="749" text-anchor="middle" class="copy">등록된 공개 공고</text>
  <text x="235" y="781" text-anchor="middle" class="copy">금액·식별정보를 제거한 질문</text>
  <text x="235" y="811" text-anchor="middle" class="small">재무 원장과 계산 결과는 제외</text>

  <g filter="url(#shadow)">
    <rect x="475" y="130" width="690" height="745" rx="24" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
    <rect x="475" y="130" width="690" height="66" rx="24" fill="#0f766e"/>
    <rect x="475" y="170" width="690" height="26" fill="#0f766e"/>
    <text x="510" y="174" class="head">2. 버팀AI 내부 처리와 결정</text>
  </g>

  <rect x="510" y="230" width="300" height="165" rx="18" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
  <text x="660" y="270" text-anchor="middle" class="box-title">상권환경 모델</text>
  <text x="660" y="307" text-anchor="middle" class="copy">LightGBM Quantile</text>
  <text x="660" y="339" text-anchor="middle" class="copy">하방·기준·회복 범위</text>
  <text x="660" y="370" text-anchor="middle" class="small">개별 점포 매출예측이 아님</text>

  <rect x="830" y="230" width="300" height="165" rx="18" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
  <text x="980" y="270" text-anchor="middle" class="box-title">정책 탐색과 자격 확인</text>
  <text x="980" y="307" text-anchor="middle" class="copy">로컬 SQLite BM25</text>
  <text x="980" y="339" text-anchor="middle" class="copy">공식 규칙과 정책 일정</text>
  <text x="980" y="370" text-anchor="middle" class="small">후보·자격 상태·확인 항목 산출</text>

  <rect x="510" y="435" width="620" height="205" rx="18" fill="#d1fae5" stroke="#0f766e" stroke-width="3"/>
  <text x="820" y="482" text-anchor="middle" class="box-title">결정론적 금융 계산 엔진</text>
  <text x="820" y="522" text-anchor="middle" class="copy">무대응과 정책 적용 일정을 같은 기준으로 계산</text>
  <text x="820" y="559" text-anchor="middle" class="copy">13주 현금·28일 필요현금·6개월 현금과 부채</text>
  <text x="820" y="596" text-anchor="middle" class="small">월 최대 상환액·만기까지 총이자·비교 순서</text>

  <rect x="510" y="680" width="620" height="150" rx="18" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
  <text x="820" y="720" text-anchor="middle" class="box-title">금융 결과 결정 권한</text>
  <text x="820" y="758" text-anchor="middle" class="copy">공식 규칙이 자격 상태와 적용 조건을 평가</text>
  <text x="820" y="793" text-anchor="middle" class="copy">금융 엔진이 현금·부채·정책 효과를 산출</text>

  <path d="M400 312 L510 312" class="green-line"/>
  <path d="M400 518 L475 518" class="green-line"/>
  <path d="M660 395 L660 435" class="green-line"/>
  <path d="M980 395 L980 435" class="green-line"/>
  <path d="M820 640 L820 680" class="green-line"/>

  <g filter="url(#shadow)">
    <rect x="1205" y="130" width="560" height="360" rx="24" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="1205" y="130" width="560" height="66" rx="24" fill="#2563eb"/>
    <rect x="1205" y="170" width="560" height="26" fill="#2563eb"/>
    <text x="1240" y="174" class="head">3. 선택형 외부 AI와 검증</text>
  </g>

  <rect x="1240" y="230" width="235" height="205" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="1358" y="270" text-anchor="middle" class="box-title">생성형 AI</text>
  <text x="1358" y="307" text-anchor="middle" class="copy">What-if 문장 해석</text>
  <text x="1358" y="339" text-anchor="middle" class="copy">공고 6개 항목 정리</text>
  <text x="1358" y="371" text-anchor="middle" class="copy">공식 근거 범위 상담</text>
  <text x="1358" y="404" text-anchor="middle" class="small">자격·금융 결과는 결정하지 않음</text>

  <rect x="1495" y="230" width="235" height="205" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="1613" y="270" text-anchor="middle" class="box-title">서버 검증</text>
  <text x="1613" y="307" text-anchor="middle" class="copy">허용된 변경만 적용</text>
  <text x="1613" y="339" text-anchor="middle" class="copy">인용문·숫자 대조</text>
  <text x="1613" y="371" text-anchor="middle" class="copy">실패한 항목은 표시하지 않음</text>
  <text x="1613" y="404" text-anchor="middle" class="small">로컬 안내나 공식 확인으로 전환</text>

  <path d="M400 735 L1180 735 L1180 332 L1240 332" class="blue-line"/>
  <path d="M1475 332 L1495 332" class="blue-line"/>
  <path d="M1495 420 L1175 420 L1175 538 L1130 538" class="blue-dash"/>

  <g filter="url(#shadow)">
    <rect x="1205" y="530" width="560" height="345" rx="24" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
    <rect x="1205" y="530" width="560" height="66" rx="24" fill="#d97706"/>
    <rect x="1205" y="570" width="560" height="26" fill="#d97706"/>
    <text x="1240" y="574" class="head">4. 사용자 출력</text>
  </g>

  <rect x="1240" y="630" width="150" height="170" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="1315" y="672" text-anchor="middle" class="box-title">진단</text>
  <text x="1315" y="712" text-anchor="middle" class="copy">상권 범위</text>
  <text x="1315" y="746" text-anchor="middle" class="small">현금·부채</text>

  <rect x="1410" y="630" width="150" height="170" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="1485" y="672" text-anchor="middle" class="box-title">비교</text>
  <text x="1485" y="712" text-anchor="middle" class="copy">무대응 대비</text>
  <text x="1485" y="746" text-anchor="middle" class="small">최대 3개 정책</text>

  <rect x="1580" y="630" width="150" height="170" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="1655" y="672" text-anchor="middle" class="box-title">준비</text>
  <text x="1655" y="712" text-anchor="middle" class="copy">자격조건</text>
  <text x="1655" y="746" text-anchor="middle" class="small">공고·신청 경로</text>

  <path d="M1130 755 L1240 715" class="green-line"/>
  <path d="M1560 715 L1580 715" class="blue-line"/>

  <rect x="35" y="915" width="1730" height="80" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="65" y="948" class="box-title">저장·전송 경계</text>
  <text x="65" y="979" class="copy">사용자 재무정보는 현재 탭과 요청 처리 중 서버 메모리에만 유지 | 외부 AI와 장기 저장에서 재무 원장·계산 결과 제외</text>

  <rect x="35" y="1020" width="1730" height="70" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="900" y="1050" text-anchor="middle" class="boundary">생성형 AI와 임베딩 검색은 자격, 정책 금액, 현금·부채와 정책 효과를 결정하거나 변경하지 않습니다.</text>
  <text x="900" y="1078" text-anchor="middle" class="small">최종 자격·승인은 공식기관이 판단하며, 서비스는 공식 신청 경로 연결에서 끝납니다.</text>
</svg>
