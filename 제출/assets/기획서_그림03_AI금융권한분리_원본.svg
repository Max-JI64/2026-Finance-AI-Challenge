<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">버팀AI의 예측, AI 설명과 금융 계산 역할 분리</title>
  <desc id="desc">상권 데이터, 사용자 재무 입력, 공식 정책 공고와 사용자가 동의한 문장을 입력으로 받아 상권환경 예측과 생성형 AI 설명을 보조하고 공식 규칙과 금융 계산 엔진이 자격과 금융 결과를 산출하는 구조</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#0f766e"/>
    </marker>
    <style>
      .title { font: 700 42px 'Malgun Gothic','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 400 22px 'Malgun Gothic','Noto Sans KR',sans-serif; fill: #475569; }
      .section { font: 700 24px 'Malgun Gothic','Noto Sans KR',sans-serif; fill: #0f172a; letter-spacing: .5px; }
      .box-title { font: 700 24px 'Malgun Gothic','Noto Sans KR',sans-serif; fill: #0f172a; }
      .box-copy { font: 400 19px 'Malgun Gothic','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 400 17px 'Malgun Gothic','Noto Sans KR',sans-serif; fill: #475569; }
      .white-title { font: 700 24px 'Malgun Gothic','Noto Sans KR',sans-serif; fill: #ffffff; }
      .guard { font: 700 23px 'Malgun Gothic','Noto Sans KR',sans-serif; fill: #7f1d1d; }
      .line { fill: none; stroke: #475569; stroke-width: 4; marker-end: url(#arrow); }
      .line-blue { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#arrowBlue); }
      .line-green { fill: none; stroke: #0f766e; stroke-width: 4; marker-end: url(#arrowGreen); }
      .line-dashed { fill: none; stroke: #2563eb; stroke-width: 4; stroke-dasharray: 10 9; marker-end: url(#arrowBlue); }
    </style>
  </defs>

  <rect width="1600" height="940" fill="#f8fafc"/>
  <text x="60" y="62" class="title">버팀AI의 예측, AI 설명과 금융 계산 역할 분리</text>
  <text x="60" y="101" class="subtitle">AI는 상권환경 예측과 공고 설명을 돕고, 자격과 금융 결과는 공식 규칙과 계산 엔진이 산출합니다.</text>

  <rect x="40" y="132" width="1520" height="174" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="173" class="section">입력과 공식 근거</text>

  <g>
    <rect x="70" y="193" width="330" height="84" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="235" y="226" text-anchor="middle" class="box-title">서울 상권·업종 집계</text>
    <text x="235" y="254" text-anchor="middle" class="small">2021년 1분기부터 2025년 4분기</text>
  </g>
  <g>
    <rect x="430" y="193" width="330" height="84" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="595" y="226" text-anchor="middle" class="box-title">사용자 재무 입력</text>
    <text x="595" y="254" text-anchor="middle" class="small">매출·현금·비용·대출·일정</text>
  </g>
  <g>
    <rect x="790" y="193" width="330" height="84" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="955" y="226" text-anchor="middle" class="box-title">서비스에 등록한 공식 공고</text>
    <text x="955" y="254" text-anchor="middle" class="small">자격 규칙·지급·상환 조건·원문</text>
  </g>
  <g>
    <rect x="1150" y="193" width="380" height="84" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="1340" y="226" text-anchor="middle" class="box-title">사용자가 직접 보낸 문장</text>
    <text x="1340" y="254" text-anchor="middle" class="small">동의한 가정 문장·개인정보를 뺀 질문</text>
  </g>

  <path d="M235 277 L235 380" class="line-blue"/>
  <path d="M595 277 L595 385 L1330 385 L1330 435" class="line-green"/>
  <path d="M955 277 L955 355 L940 355 L940 420" class="line-green"/>
  <path d="M1340 277 L1340 335 L570 335 L570 420" class="line-blue"/>

  <rect x="40" y="340" width="735" height="335" rx="24" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="340" width="735" height="58" rx="24" fill="#2563eb"/>
  <rect x="40" y="374" width="735" height="24" fill="#2563eb"/>
  <text x="70" y="378" class="white-title">예측·설명 보조 영역</text>

  <rect x="70" y="420" width="310" height="164" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="225" y="461" text-anchor="middle" class="box-title">상권환경 모델</text>
  <text x="225" y="495" text-anchor="middle" class="box-copy">1분기·2분기 매출 증감률</text>
  <text x="225" y="527" text-anchor="middle" class="box-copy">세 값을 현금 계산에 적용</text>
  <text x="225" y="557" text-anchor="middle" class="small">주차별 현금은 금융 엔진이 계산</text>

  <rect x="415" y="420" width="330" height="164" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="580" y="458" text-anchor="middle" class="box-title">생성형 AI</text>
  <text x="580" y="492" text-anchor="middle" class="box-copy">선택형 가정 문장 해석</text>
  <text x="580" y="524" text-anchor="middle" class="box-copy">공고 핵심정보 정리</text>
  <text x="580" y="556" text-anchor="middle" class="small">공식 근거 안에서 쉽게 설명</text>

  <rect x="415" y="600" width="330" height="52" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="580" y="633" text-anchor="middle" class="small">가정 범위·공고 인용문·숫자 확인</text>
  <path d="M580 584 L580 600" class="line-blue"/>

  <rect x="825" y="340" width="735" height="335" rx="24" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="825" y="340" width="735" height="58" rx="24" fill="#0f766e"/>
  <rect x="825" y="374" width="735" height="24" fill="#0f766e"/>
  <text x="855" y="378" class="white-title">자격 확인·금융 계산 영역</text>

  <rect x="855" y="420" width="205" height="164" rx="18" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
  <text x="957" y="458" text-anchor="middle" class="box-title">공식 규칙</text>
  <text x="957" y="494" text-anchor="middle" class="box-copy">서비스 기준</text>
  <text x="957" y="524" text-anchor="middle" class="box-copy">적격·부적격</text>
  <text x="957" y="554" text-anchor="middle" class="small">추가 확인 상태</text>

  <rect x="1085" y="420" width="205" height="164" rx="18" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
  <text x="1187" y="458" text-anchor="middle" class="box-title">지급·상환 일정</text>
  <text x="1187" y="494" text-anchor="middle" class="box-copy">지급·감면·자부담</text>
  <text x="1187" y="524" text-anchor="middle" class="box-copy">대출·거치·상환</text>
  <text x="1187" y="554" text-anchor="middle" class="small">검증된 조건만 반영</text>

  <rect x="1315" y="420" width="215" height="164" rx="18" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
  <text x="1422" y="458" text-anchor="middle" class="box-title">금융 계산 엔진</text>
  <text x="1422" y="494" text-anchor="middle" class="box-copy">13주 현금흐름</text>
  <text x="1422" y="524" text-anchor="middle" class="box-copy">6개월 부채·상환</text>
  <text x="1422" y="554" text-anchor="middle" class="small">확정 대안 순위</text>

  <path d="M1060 502 L1085 502" class="line-green"/>
  <path d="M1290 502 L1315 502" class="line-green"/>
  <path d="M745 626 L800 626 L800 605 L1315 605 L1315 565" class="line-dashed"/>

  <text x="70" y="715" class="section">사용자에게 보이는 결과</text>
  <path d="M1422 584 L1422 735 L300 735 L300 744" class="line-green"/>
  <path d="M1422 735 L800 735 L800 744" class="line-green"/>
  <path d="M1422 735 L1300 735 L1300 744" class="line-green"/>

  <g filter="url(#shadow)">
    <rect x="70" y="744" width="455" height="91" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <text x="297" y="780" text-anchor="middle" class="box-title">진단</text>
    <text x="297" y="813" text-anchor="middle" class="box-copy">13주 현금·28일 필요현금·6개월 부채</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="570" y="744" width="455" height="91" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <text x="797" y="780" text-anchor="middle" class="box-title">비교</text>
    <text x="797" y="813" text-anchor="middle" class="box-copy">무대응 대비 정책별 현금·부채 변화</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1070" y="744" width="460" height="91" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
    <text x="1300" y="780" text-anchor="middle" class="box-title">준비</text>
    <text x="1300" y="813" text-anchor="middle" class="box-copy">자격조건·공고 핵심정보·공식 경로</text>
  </g>

  <rect x="70" y="864" width="1460" height="55" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="800" y="899" text-anchor="middle" class="guard">생성형 AI는 정책 자격, 금액과 현금·부채·상환 결과를 결정하거나 변경하지 않습니다.</text>
</svg>
